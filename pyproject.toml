[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socu"]

[project]
name = "socu"
version = "0.0.1"
dependencies = [
  "warp-lang",
  "numpy",
  "scipy",
  "ipykernel>=6.31.0",
]
requires-python = ">=3.9"
authors = [
  {name = "Roland Schwan", email = "roland.schwan@epfl.ch"},
]
description = "socu"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICEN[CS]E.*"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-s"]
testpaths = [
  "tests",
]


[project.optional-dependencies]
cuda = [
    "torch",
]
cpu = [
    "torch",
]
cuda130 = [
    "torch",
]

[dependency-groups]
ext = [
    "ninja",
]

[tool.uv]
conflicts = [
    [
        {extra = "cuda"},
        {extra = "cuda130"},
        {extra = "cpu"},
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-cuda130", extra = "cuda130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
